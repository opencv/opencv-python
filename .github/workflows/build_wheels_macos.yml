name: MacOS

on:
  pull_request:
    branches:
      - 4.x
      - 5.x
    paths-ignore:
      - '.github/workflows/build_wheels_manylinux*'
      - '.github/workflows/build_wheels_windows*'
  release:
    types: [published, edited]
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:


jobs:
  Build:
    runs-on: ${{ matrix.platform == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10']
        platform: [x86_64, arm64]
        with_contrib: [0, 1]
        without_gui: [0, 1]
        build_sdist: [0]
    env:
      CI_BUILD: 1
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      REPO_DIR: .
      PROJECT_SPEC: opencv-python
      MB_PYTHON_VERSION: ${{ matrix.python-version }}
      TRAVIS_PYTHON_VERSION: ${{ matrix.python-version }}
      MB_ML_VER: 2014
      TRAVIS_BUILD_DIR: ${{ github.workspace }}
      TRAVIS_OS_NAME: osx
      CONFIG_PATH: travis_config.sh
      USE_CCACHE: 1
      UNICODE_WIDTH: 32
      PLAT: ${{ matrix.platform }}
      SDIST: ${{ matrix.build_sdist || 0 }}
      ENABLE_HEADLESS: ${{ matrix.without_gui }}
      ENABLE_CONTRIB: ${{ matrix.with_contrib }}
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cleanup
      run: find . -mindepth 1 -delete
      working-directory: ${{ github.workspace }}
    - name: Setup environment
      run: |
        if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "ENABLE_ROLLING=1" >> $GITHUB_ENV
        fi
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 0
    - name: Build a package
      run: |
        git submodule update --init multibuild
        echo $ENABLE_CONTRIB > contrib.enabled
        echo $ENABLE_HEADLESS > headless.enabled
        export MACOSX_DEPLOYMENT_TARGET=14.0
        python --version
        python -m pip install delocate toml && python -c 'import toml; c = toml.load("pyproject.toml"); print("\n".join(c["build-system"]["requires"]))' | python -m pip install -r /dev/stdin
        python setup.py bdist_wheel --py-limited-api=cp37 --dist-dir=wheelhouse -v
        delocate-wheel ${{ github.workspace }}/wheelhouse/opencv*
    - name: Saving a wheel accordingly to matrix
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.platform }}-${{ matrix.with_contrib }}-${{ matrix.without_gui }}-${{ matrix.build_sdist }}
        path: wheelhouse/opencv*.whl

  Test:
    needs: [Build]
    runs-on: ${{ matrix.platform == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        platform: [x86_64, arm64]
        with_contrib: [0, 1]
        without_gui: [0, 1]
        build_sdist: [0]
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      MB_PYTHON_VERSION: ${{ matrix.python-version }}
      CONFIG_PATH: travis_config.sh
      PLAT: ${{ matrix.platform }}
      OPENCV_TEST_DATA_PATH: ${{ github.workspace }}/opencv_extra/testdata
      PYLINT_TEST_FILE: ${{ github.workspace }}/opencv/samples/python/squares.py
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cleanup
      run: find . -mindepth 1 -delete
      working-directory: ${{ github.workspace }}
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
    - name: Download a wheel accordingly to matrix
      uses: actions/download-artifact@v8
      with:
        name: wheel-${{ matrix.platform }}-${{ matrix.with_contrib }}-${{ matrix.without_gui }}-${{ matrix.build_sdist }}
        path: wheelhouse/
    - name: Create Venv for test
      run: |
        test -d "${{ github.workspace }}/opencv_test" && rm -rf "${{ github.workspace }}/opencv_test"
        python -m venv ${{ github.workspace }}/opencv_test
    - name: Package installation
      run: |
        source ${{ github.workspace }}/opencv_test/bin/activate
        python --version
        python -m pip install --upgrade pip
        python -m pip install --no-cache --force-reinstall wheelhouse/opencv*.whl
        cd ${{ github.workspace }}/tests
        python get_build_info.py
    - name: Run tests
      run: |
        source ${{ github.workspace }}/opencv_test/bin/activate
        cd ${{ github.workspace }}/opencv
        python modules/python/test/test.py -v --repo .
    - name: Pylint test
      run: |
        source ${{ github.workspace }}/opencv_test/bin/activate
        python -m pip install pylint==2.15.9
        cd ${{ github.workspace }}/tests
        python -m pylint $PYLINT_TEST_FILE

  Release_rolling:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: [Build, Test]
    runs-on: ubuntu-22.04
    environment: opencv-python-rolling-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheelhouse/
      - name: Select only OpenCV wheels
        run: |
          mkdir dist dist-contrib dist-headless dist-contrib-headless
          cp wheelhouse/wheel-*/opencv_python_rolling-* dist/
          cp wheelhouse/wheel-*/opencv_contrib_python_rolling-* dist-contrib/
          cp wheelhouse/wheel-*/opencv_python_headless_rolling-* dist-headless/
          cp wheelhouse/wheel-*/opencv_contrib_python_headless_rolling-* dist-contrib-headless/
      - name: Upload wheels for opencv_python_rolling
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_contrib_python_rolling
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-contrib/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_python_headless_rolling
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-headless/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_contrib_python_headless_rolling
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-contrib-headless/
          print-hash: true
          skip-existing: true

  Pre-release:
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: [Build, Test]
    runs-on: ubuntu-22.04
    environment: test-opencv-python-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheelhouse/
      - name: Select only OpenCV wheels
        run: |
          tree
          mkdir dist
          cp wheelhouse/wheel-*/opencv_* dist/
      - name: Upload all wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  Release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [Build, Test]
    runs-on: ubuntu-22.04
    environment: opencv-python-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheelhouse/
      - name: Select only OpenCV wheels
        run: |
          mkdir dist dist-contrib dist-headless dist-contrib-headless
          cp wheelhouse/wheel-*/opencv_python-* dist/
          cp wheelhouse/wheel-*/opencv_contrib_python-* dist-contrib/
          cp wheelhouse/wheel-*/opencv_python_headless-* dist-headless/
          cp wheelhouse/wheel-*/opencv_contrib_python_headless-* dist-contrib-headless/
      - name: Upload wheels for opencv_python
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_contrib_python
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-contrib/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_python_headless
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-headless/
          print-hash: true
          skip-existing: true
      - name: Upload wheels for opencv_contrib_python_headless
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-contrib-headless/
          print-hash: true
          skip-existing: true
